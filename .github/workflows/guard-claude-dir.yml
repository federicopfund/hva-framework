name: Strip .claude/ from main

on:
  push:
    branches: [main]
    paths:
      - '.claude/**'

permissions:
  contents: write

jobs:
  strip-claude:
    name: Auto-remove .claude/ from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove .claude/ and push cleanup commit
        run: |
          git rm -r --cached .claude/ --ignore-unmatch
          if git diff --cached --quiet; then
            echo "Nothing to remove — skipping commit."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore(auto): strip .claude/ from main [skip ci]"
          git push
